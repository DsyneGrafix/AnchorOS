[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorintel-api"
version = "0.5.0"
description = "AnchorOS service API for the S.P.A.T.I.A.L. infrastructure opportunity assessment lifecycle"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Sirius Logic Systems"}]
dependencies = ["spatial-opportunity-engine>=0.1.0"]

[project.scripts]
anchorintel-api = "anchorintel_api.server:main"

[tool.setuptools.packages.find]
include = ["anchorintel_api*"]

[tool.setuptools.package-data]
anchorintel_api = ["knowledge_modules/*.json"]
